 <!-- Contact Section -->
<section id="contact" class="contact py-5">
  <div class="container">
    <h2 class="text-center mb-8 fw-bold">Send Us a Message</h2>
    <div class="row align-items-center">
      
      <!-- Left Side Image -->
      <div class="col-md-6 mb-4 mb-md-0" data-aos="fade-right">
        <img src="images/we.jpg" alt="Contact Us" class="img-fluid rounded shadow">
      </div>
      
      <!-- Right Side Form -->
      <div class="col-md-6" data-aos="fade-left">
        <div class="p-4 shadow rounded bg-white">
          <form id="contact-form">
            <div class="form-group mb-3">
              <label for="name" class="form-label">Name</label>
              <input type="text" id="name" name="name" required class="form-control" placeholder="Your Name">
            </div>
            <div class="form-group mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" name="email" required class="form-control" placeholder="Your Email">
            </div>
            <div class="form-group mb-3">
              <label for="message" class="form-label">Message</label>
              <textarea id="message" name="message" required class="form-control" placeholder="Your Message" rows="4"></textarea>
            </div>
            <button type="submit" class="btn gold-btn w-100">Send Message</button>
          </form>

          <!-- Social Media Links -->
          <div class="social-links mt-4 text-center">
            <a href="https://web.facebook.com/rahmet.ahmed.16718979#" class="social-icon mx-3"><i class="fab fa-facebook fa-2x"></i></a>
            <a href="https://www.linkedin.com/in/rahmet-ahmed-096544278/" class="social-icon mx-3"><i class="fab fa-linkedin fa-2x"></i></a>
             <a href="#" class="social-icon mx-3"><i class="fab fa-instagram fa-2x"></i></a>
           
          </div>
        </div>
      </div>

    </div>
